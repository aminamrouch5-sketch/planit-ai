<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLANIT AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- HEADER -->
  <header class="bg-white border-b p-4 flex flex-col gap-3 md:flex-row md:justify-between md:items-center">
    <div class="text-xl font-bold shadow-xl">
      PLANIT <span class="text-indigo-600">AI</span>
    </div>

    <nav class="flex gap-2 text-sm">
      <a href="#" class="bg-indigo-100 text-indigo-600 px-3 py-2 rounded font-semibold shadow-xl">
        Dashboard
      </a>
      <a href="./newproject.html" class="text-gray-600 px-3 py-2 rounded shadow-xl">
        Nouveau projet
      </a>
    </nav>

    <button class="w-fit border px-3 py-2 rounded text-sm font-semibold shadow-xl">
      ✧ Paramètres IA
    </button>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-4xl mx-auto p-5 flex flex-col gap-6">

    <!-- Top Notice -->
    <div class="text-xs text-gray-500">
      <span class="bg-indigo-100 text-indigo-600 font-bold px-2 py-1 rounded-full">
        ● MAQUETTE INTERACTIVE
      </span>
      <p class="py-3">
      Les actions illustrent les états de l’interface ; aucune donnée n’est enregistrée.
      </p>
    </div>

    <!-- Page Title & Button -->
    <div class="flex flex-col gap-2">
      <span class="text-xs font-bold text-gray-500">
        ESPACE DE TRAVAIL / VUE D’ENSEMBLE
      </span>
      <h1 class="text-3xl font-bold">
        Vos projets, en bonne voie.
      </h1>
      <p class="text-sm text-gray-500">
        Un regard clair sur les idées qui prennent forme.
      </p>
      <button class="mt-2 w-fit bg-indigo-600 text-white text-sm font-semibold px-4 py-2 rounded">
        + Créer un projet
      </button>
    </div>

    <!-- CARDS CONTAINER -->
    <div class="flex flex-col md:flex-row gap-6" id="card-container">

    
    </div>
    <button class="w-full bg-indigo-600 text-white text-sm font-semibold py-2 px-4 rounded shadow-xl" id="button-demo">
            Demarrer Demo
    </button>
  </main>
<script src="./js/UI.js" type="module"></script>
</body>
</html>
